id: g3-route-02
parents: [g2-match-mem, g2-match-pf]
track: router
hypothesis: >-
  A prior-free router that lands in the word basin, led there by the model's own next-byte uncertainty. Under
  "end" semantics the router decides at byte t whether t closes a chunk without seeing byte t+1. In the suffix basin
  it guesses that t+1 will be a space; in the word basin it cuts on the space itself, where the next byte (a word's
  first letter) is the hard one. The quantity that separates the two is causal at t: the entropy H_t of
  p(x_{t+1} | x_<=t). A rank-32 next-byte probe on the detached stage-0 encoder output (own CE) gives H_t. On a
  300-step checkpoint its top 1/N puts 58% of cuts on whitespace, covers 82% of whitespace bytes and 3% of cuts are
  letter-before-space, the suffix basin's signature. The decider ranks the router's standardized score + a learned
  gain (init 1) x standardized H_t, restandardized. This is permanent, learned, and names no byte class (guardrail 4).
  The CPU basin probes (smoke.txt, L03, 300 steps, seeds 1-3) showed this alone does not beat the lottery. They also
  found what does, one measured failure at a time. (1) The losing init puts the space byte at the very bottom of the
  router's ranking from step 5, and the feature cannot outvote it. So the router's output layer starts at zero
  (router_kwargs.init_scale 0: no byte value is preferred at init), with score_floor 0.1 so that standardizing the
  constant scores neither revives a tiny init preference nor multiplies the router gradient by 1/std (grad norm 34 ->
  normal). (2) Even then, on one seed the router's OWN gradient pushed spaces down: its decisions sat 57% on
  whitespace at step 35 while its own top-k stayed at 0%, and it took the decisions back. So during a
  feature-led start (labelled curriculum: the router's weight in the mix rises 0.1 -> 1 over the first 30% of
  training) the router's own standardized score is also taught the probe's top-k (scale-free BCE, weight 1 -> 0).
  Result: word basin on 3/3 seeds (the prior-free control: 1/3). The router adopts the basin itself (its own top-k
  65% on whitespace by step 65-95, the warm-start reference's level). Smoke val 2.465 / 2.471 / 2.484 vs the
  control's 2.485 / 2.466 / 2.513 and the warm start's 2.444 / 2.492. This differs from the pending self-surprise
  teacher (g2-router-01: full-model entropy RISE as a BCE target, decaying): here the signal is a causal probe
  available at eval time, a permanent decision feature, plus the init and score-scale fixes the probes showed are needed.
  Built on the best H-Net (g2-match-mem: match model + suffix-keyed chunk memory, 1.483 with the warm start) with the
  warm start removed. The prior-free control with copying is g2-match-pf (1.558, suffix basin on seed 1).
prediction:
  fitness: -0.179            # 1.490: within 0.01 of the warm-start g2-match-mem (1.483), 0.07 better than g2-match-pf
  mechanism: >-
    bnd_on_ws/s0 at step 300 = 0.62 (range 0.50-0.72; prior-free suffix runs <= 0.08, hnet_ws 0.71 at the end) on
    both seeds; router_own_on_ws/s0 >= 0.5 and router_agree/s0 >= 0.8 by step 300 (the router adopted the basin, not
    overruled); feat_gain_pt/s0 at the end 0.4-0.9 (smokes: 1 -> 0.68); seed spread <= 0.03.
  falsified_if: bnd_on_ws/s0 < 0.3 at step 300 on either seed, or fitness >= g2-match-pf's (-0.112), or spread > 0.03
branch: evolve/g3-route-02
model: configs/evolve/models/g3-route-02.yaml
set: []
