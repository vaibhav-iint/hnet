    test_model_hnet / test_invariances (2 new variants) / test_flops / test_grad_audit / test_quantile_decision /
    test_decision_explore / test_router_surprise / test_router_prior / test_match_model / test_adoption_options /
    test_chunk_vocab_suffix / test_local_router: 238 passed, 4 skipped; full suite (tests/): 935 passed, 44 skipped
  fairness: logbook/evolve/candidates/g3-route-01/fairness.txt   # pass (strict), +0.52% FLOPs/byte
  grad_audit: logbook/evolve/candidates/g3-route-01/grad_audit.txt
  smoke: logbook/evolve/candidates/g3-route-01/smoke.txt          # pass, + per-source compression tables
