  flops: "0.020656 GFLOPs/byte training, identical to g4-combo-02 (+1.39% vs hnet): rows are lookups"
  tests: "config-only candidate (no code path of its own): the trie and chunk-table code are covered by
    tests/test_trie_topk.py, tests/test_chunk_vocab_suffix.py, tests/test_invariances.py;
    tests/test_main_memory.py::test_candidate_configs_fit_the_budget checks its params and FLOPs. Full suite (CPU):
    999 passed, 44 skipped, 1 deselected (tests/test_eval_smoke_gpt2.py::test_gpt2_hellaswag_50, network)"
  grad_audit: logbook/evolve/candidates/g5-output-02/grad_audit.txt
  smoke: logbook/evolve/candidates/g5-output-02/smoke.txt
  budget_probe: logbook/evolve/candidates/g5-output-02/budget_probe.json
  fairness: logbook/evolve/candidates/g5-output-01/fairness.md
bpe_analogue: >-
  None that changes the comparison: BPE's output-side memory is its 32768 x 256 LM head (8.4M), and enlarging it means
  a larger vocabulary, i.e. a different tokenizer and more head FLOPs per token; it has no input-side table to take the
  parameters from. The comparison stays against g2-bpe-match.
author: output / parameter-budget proposer (generation 5)
next_if_fails: >-
  If neutral: the chunk table's second half and 1.5x trie rows are worth about the same; the next slice to try is
  the 7/8-gram tables (0.010/M) -> trie dim 32 -> 48 (FLOPs +0.12%). If worse by > 0.006: the suffix-keyed chunk
  memory is load-bearing at this size in the full stack (the g1-wild-01 ablation has no suffix keys), keep 12821.
