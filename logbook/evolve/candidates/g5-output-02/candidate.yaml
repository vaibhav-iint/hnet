id: g5-output-02
parents: [g4-combo-02]
track: output
hypothesis: >-
  Reallocate the parameter budget from the input side to the output side by measurement rather than argument. A
  mean-ablation of every FLOP-free table of the trained g1-wild-01 checkpoint (hnet_ws + byte match model;
  budget_probe.json: each table's rows replaced by its mean row, no retraining, 24 val windows) ranks them per
  parameter: chunk table 0.0045 bpb/M (9.88M, +0.0445), 8-gram 0.0097/M, 7-gram 0.0104/M, 6-gram 0.020/M, 5-gram
  0.042/M, 4-gram 0.089/M, 3-gram 0.17/M; match-model input / decoder embeddings 0.50 / 0.15 /M. The chunk table is the
  least load-bearing table per parameter in a copy model too (the g3 probe found the same on hnet_ws, 0.0036/M for
  its halving), while the output-side memory is the loop's largest win per parameter (the fast trie: -0.025 on top of
  copying for 4.96M in g3-mem-02, ~0.005/M, funded by the chunk table's first halving). The trie is row-starved by
  construction: one hashed row per (chunk prefix . byte) key, 61k distinct keys in 409 KB of validation text against
  77383 rows per table for the whole corpus (g3 probe). This candidate halves the chunk table again (12821 -> 6410
  buckets per hash, -2.46M) and gives every freed parameter to the trie's rows (77383 -> 115849 per table): zero
  extra FLOPs (lookups), the same parameter count as g4-combo-02. With g5-output-01 (the same 2.46M as a main-network
  memory) and g4-combo-02 (the same 2.46M in the chunk table) it is a three-way allocation test of one budget slice:
  input chunk identity vs byte-level output spelling vs chunk-level state memory.
prediction:
  fitness: "val bpb = g4-combo-02 - 0.003 +- 0.008 at equal seeds; falsified if >= g4-combo-02 + 0.006 (the chunk
    table's second half carries more than 1.5x trie rows buy)"
  mechanism: >-
    trie/bonus_rms above g4-combo-02's at the same step from step 300 on (fewer collisions per row); the gain sits
    inside chunks (prefix length >= 1, where the trie keys are non-empty), not at chunk starts; chunk_vocab_ce/s0
    (next-chunk CE over 6410 buckets) is lower than g4-combo-02's only because the bucket space is smaller: compare
    byte bpb, not that number; trie/topk_cov unchanged (>= 0.995).
branch: evolve/g5-output
model: configs/evolve/models/g5-output-02.yaml
set: ["model.lr_multiplier_kinds=[embed,head,other]"]
