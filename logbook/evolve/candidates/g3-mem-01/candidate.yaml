bpe_analogue: >-
  None beyond the BPE arm itself. Read with chunk = unit, the trie scores "the current unit's prefix + the next
  symbol" against the main network's prediction. A BPE model emits a whole token per prediction, so its prefix is
  always empty and the key is the token itself: the analogue is u . P[w] over the 32k tokens, a second rank-32
  output embedding on the same hidden state, which BPE's 32768 x 256 LM head (8.4M parameters, 42% of its budget)
  already subsumes (two linear heads on one hidden state are one linear head). BPE already spends 1.7x the trie's 5M
  parameters on exactly this string-keyed output memory; the trie gives the byte model the same kind of memory. What
  the trie scores that BPE's head does not -- partial chunks, byte by byte -- BPE never has to predict. A memory keyed
  across units (previous token + candidate, an output n-gram memory) is a different mechanism whose H-Net counterpart
  would be a trie keyed across chunk ends; the trie's prefix resets at every chunk end. So no new BPE control.
author: memory proposer (generation 3)
next_if_fails: >-
  If val bpb > 1.75: check trie/topk_cov; if < 0.995 raise k to 96-128 (still < 1.3x by the head micro-benchmark's
  scaling); if coverage is high but the gain is gone, the full head's value was in the softmax over all 256 bytes
  (pushing every implausible byte down) and a cheap full-vocabulary term (a context-free per-prefix bias over 256
  bytes, 1 number per row) should be added.
