id: g3-mem-01
parents: [g1-mem-01]
track: memory
hypothesis: >-
  The prefix-trie output vocabulary (g1-mem-01: 1.7375 / 1.7305 on seeds 1 / 2, mean 1.734 vs hnet_ws 1.829, the
  largest gain of generation 1) loses nothing by scoring only the bytes the model already finds plausible, and that
  makes it cheap. The full head scores all 256 bytes at every position: per byte it gathers 2 x 256 table rows of 32
  numbers and, in the backward pass, scatters 2 x 256 row gradients into the tables (under activation checkpointing,
  so the gather runs twice); on the A100 its mean step took 1.88 s vs 1.02 s for hnet_ws (1.84x; fastest steps 1.66 vs
  0.73 s, 2.3x). This candidate keeps the
  trie's keys (hash(chunk prefix . b)), tables, sizes and main-network query unchanged and adds the score only for the
  k = 64 bytes ranked highest by the LM head (detached top-k; hnet/model/trie_head.py TrieHead.rescore, flag
  trie_head.topk). Measured fact it builds on: on the trained hnet_ws L03 checkpoint the target byte is among the LM
  head's top 64 at 99.88% of positions, and the positions where it is not carry 1.1% of the model's bits (0.018 bpb);
  at top 16 (the g1-wild-02 prefix head, 1.770) it is 3.1% of positions and 14% of the bits (0.245 bpb), at top 32
  0.8% / 4.6% (0.081 bpb) (logbook/evolve/candidates/g3-mem-02/budget_probe.json). That is a plausible reason the
  prefix head kept only 60% of the trie's gain (it also differed in query and table shape), and why k = 64, not 16:
  the bits a top-k head cannot reach sit mostly on chunk-initial bytes, where the LM head is least sure (top-16
  coverage 0.90 there vs 0.99 inside chunks), and the chunk-initial byte is where the main network's next-chunk
  prediction, the trie's query, carries the most information. With
  k = V the head is exactly the full trie (tested). Everything else is g1-mem-01 (same parameter layout, same
  budget: the chunk-vocabulary table halved to 12853 buckets pays for 2 x 77383 x 32 trie rows).
prediction:
  fitness: "val bpb 1.734-1.745 (g1-mem-01 1.734 mean of 2 seeds; parent hnet_ws 1.829): keeps >= 90% of the trie's gain"
  speed: "A100 step time <= 1.3x hnet_ws (mean step; the full head was 1.84x)"
  mechanism: >-
    trie/topk_cov >= 0.995 from step 300 on (fraction of positions whose next byte is among the 64 rescored ones);
    trie/bonus_rms (rms over the 64 rescored bytes) grows past 1.0 by step 300; bnd_on_ws/s0 at the end ~0.47 as in
    g1-mem-01 (hnet_ws 0.61: the trie moves cuts off whitespace). Falsified if val bpb > 1.75 (keeps < 80% of the
    gain), or if the gain sits on the 0.1% of positions outside the top 64 (then the full head's value was in
    promoting bytes the LM head ranks low, and k must grow).
