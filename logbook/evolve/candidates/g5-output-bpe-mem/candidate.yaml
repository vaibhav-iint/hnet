id: g5-output-bpe-mem
parents: [g2-bpe-match]
track: control
base: bpe            # scripts/evolve/make_gen.py builds this run from the benchmark's bpe arm (config, model, set)
hypothesis: >-
  The BPE analogue of g5-output-01. The H-Net candidate gives its main network (the only module that runs at chunk
  level) a product-key memory: 97^2 values of width 256, top-32 product-key read, query centered by a running mean,
  added to the residual stream before layer 2 of 3. A BPE Transformer runs every layer at token level, and tokens
  and chunks have the same rate (4.145 bytes), so the same memory at the same depth, read once per token, is the
  faithful analogue. If BPE + copy gains as much from it as the H-Net does, the memory is a generic small-model win
  and does not move the H-Net's margin over the bar; the H-Net-specific claim is that its chunk-start bits are
  state-limited (probes in g5-output-01/probes.json) while its FLOP-free byte-level tables can pay for the memory.
  The H-Net funds the memory from its chunk table (parameter-neutral); BPE has no FLOP-free table it can shrink
  without changing its tokenizer, so here the memory comes on top: +2.43M params (22.59M vs 20.16M for g2-bpe-match),
  +0.22% training FLOPs per token. That makes the control an upper bound for BPE.
prediction:
  fitness: "val bpb below g2-bpe-match (1.461) by <= the H-Net candidate's gain over g4-combo-02; if BPE gains >= 80%
    of it, the memory does not count as an H-Net advantage"
  mechanism: "memory/slots_used >= 0.9 from step 0 (0.92 at init on real tokens: BPE's stream starts diverse, the
    H-Net's does not); memory/out_rms / in_rms >= 0.1 by the end"
branch: evolve/g5-output
