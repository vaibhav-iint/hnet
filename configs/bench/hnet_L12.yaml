# Provisional 1-stage byte H-Net for rung L12: the BPE rung's Transformer as main network (D=896), Mamba-2 byte
# encoder/decoder (4 + 4 layers at width 448), end_mlp router with rank decisions at 4.3x. Benchmark only.
include: _bench_hnet.yaml
model:
  type: hnet
  arch_layout: ["m4", ["T12"], "m4"]
  d_model: [448, 896]
  d_intermediate: [0, 3200]
  vocab_size: 256
  tie_embeddings: false
  ssm: {d_state: 128, d_conv: 4, expand: 2, headdim: 64, ngroups: 1, chunk_size: 256}
  attn: {num_heads: [7, 12], head_dim: [null, 128], rotary_emb_dim: [32, 128], window_size: [1023, -1]}
  dc: {target_ratios: [4.3], ratio_loss_alpha: 0.03, router: end_mlp, decision: quantile, chunker: select,
       dechunker: ema, ste: true, aux_loss: ratio}
  lr_multiplier: auto
  lr_multiplier_n_gpt: 4.3
train: {out_dir: runs/bench/hnet_L12}
