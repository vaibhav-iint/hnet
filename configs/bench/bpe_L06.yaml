# Provisional BPE rung L06 (depth 6, D=512, heads = depth, head dim 128, SwiGLU ~3.6D, 32k vocab). Benchmark only.
include: _bench_bpe.yaml
model:
  type: dense
  variant: llama
  vocab_size: 32768
  d_model: 512
  n_layers: 6
  d_intermediate: 1856
  num_heads: 6
  head_dim: 128
  tie_embeddings: false
train: {out_dir: runs/bench/bpe_L06}
