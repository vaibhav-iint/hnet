# CPU smoke test of s1_modded.yaml: tiny modded GPT on synthetic word tokens (vocab 256 covers ids and EOT 255).
include: [s1_modded.yaml, _tiny_cpu.yaml]
model:
  vocab_size: 256
  d_model: 64
  n_layers: 4
  d_intermediate: 256
  num_heads: 2
  extra: {n_value_embeds: 1, skip_attn_layers: [2], window_tokens: [128, 256]}
data: {seq_len: 256, batch_tokens: 1024, eot: 255}
train: {out_dir: runs/speedrun/tiny_s1_modded}
