# S2, 1-stage H-Net, AdamW with per-stage LR multipliers (the paper's recipe), same bytes and steps as S1.
# LR 2e-3 with 100 warmup steps is a proposal (paper-style AdamW at ~125M); sweep it before the matched run.
include: _s2_bytes.yaml
model: {include: ../models/hnet1_speedrun.yaml}
train:
  out_dir: runs/speedrun/s2_hnet1_adamw
  optimizer: adamw
  lr: 2.0e-3
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  schedule: {name: wsd, warmup: 100, decay: 0.4, decay_shape: linear, min_lr_ratio: 0.0}
