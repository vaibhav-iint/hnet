# EXP-002: architecture search at ~2M-param (FLOPs-matched to tiny_bpe_2m) scale. PLAN.md §2b.
# Every run: FineWeb-Edu shard 1, 2048-byte windows (448-token windows for BPE), 64 windows/step, 50M token-equivalents,
# AdamW peak LR 1.5e-3 with WSD (10% warmup, 20% decay). Screening metric: final val bpb (same val text for all),
# plus chunk diagnostics (diag.json) against the blog's targets (EXP-001). Logged on the fly: train metrics every 10
# steps, val CE/bpb every 250 steps, paper7 task metrics (acc, acc_norm, soft bpb) every 500 steps.
name: exp002_tiny2m
out_root: runs/search/exp002_tiny2m
seeds: [0, 1]
set:
  - train.compile=false        # tiny models + data-dependent shapes: compile overhead not worth it
  - "eval.downstream={every: 500, suite: paper7, limit: 300, n_boot: 0}"   # task curves during training
runs:
  - {name: bpe,              config: configs/runs/tiny_bpe_2m.yaml}
  - {name: paper,            config: configs/runs/tiny_hnet2_2m.yaml}                      # cosine_lookahead, (3,3)
  - {name: end_linear,       config: configs/runs/tiny_hnet2_2m.yaml, set: [model.dc.router=end_linear]}
  - {name: end_mlp,          config: configs/runs/tiny_hnet2_2m.yaml, set: [model.dc.router=end_mlp]}
  - {name: end_cosine_shift, config: configs/runs/tiny_hnet2_2m.yaml, set: [model.dc.router=end_cosine_shift]}
  - {name: paper_r42,        config: configs/runs/tiny_hnet2_2m_ratios42.yaml}             # blog targets (4,2)
  - {name: paper_nosmooth,   config: configs/runs/tiny_hnet2_2m.yaml, set: [model.dc.dechunker=repeat]}
  - {name: paper_nolrmult,   config: configs/runs/tiny_hnet2_2m.yaml, set: [model.lr_multiplier=null]}
  - {name: paper_alpha01,    config: configs/runs/tiny_hnet2_2m.yaml, set: [model.dc.ratio_loss_alpha=0.1]}
report:   # scripts/search/report.py (logbook/exp002_progress.py and exp002_summary.py are thin wrappers)
  baseline: bpe
  groups:
    "Boundary routers": [paper, end_linear, end_mlp, end_cosine_shift]
    "Ablations of the paper router": [paper, paper_r42, paper_nosmooth, paper_nolrmult, paper_alpha01]
  labels: {bpe: BPE baseline, paper: paper router (LH-Net), end_linear: "end-of-chunk, linear",
           end_mlp: "end-of-chunk, MLP", end_cosine_shift: "end-of-chunk, cosine", paper_r42: "targets (4,2)",
           paper_nosmooth: no smoothing, paper_nolrmult: no LR multipliers, paper_alpha01: "ratio loss α=0.1"}
