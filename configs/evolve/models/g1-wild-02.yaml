# g1-wild-02 (evolve g1, wildcard track): hnet_ws_L03 + a prefix output dictionary (hnet/model/prefix_head.py).
# The LM head's top-16 bytes are rescored by q_t . K[hash(current chunk prefix + byte)], q_t from the final hidden
# state and the dechunked main-network output: a BPE-style output embedding over the trie of the learned chunks.
# 4.1M parameters move from the chunk-vocabulary input table (25733 -> 15000 buckets) to the output table (64000 x 64).
model:
  type: hnet
  arch_layout: [m2, [T3], m2]
  d_model: [192, 256]
  d_intermediate: [0, 896]
  vocab_size: 256
  tie_embeddings: false
  ssm: {d_state: 160, d_conv: 4, expand: 2, headdim: 64, ngroups: 1, chunk_size: 256}
  attn:
    num_heads: [3, 3]
    num_kv_heads: null
    head_dim: [null, 128]
    rotary_emb_dim: [null, null]
    rope_theta: 10000.0
    window_size: [-1, -1]
    nope_every: 0
  dc:
    target_ratios: [4.145]
    ratio_loss_alpha: 0.03
    router: end_mlp
    router_kwargs: {}
    decision: quantile
    chunker: select
    dechunker: ema
    ste: true
    aux_loss: ratio
    aux_loss_scope: local
    chunk_vocab:
    - {buckets: 15000, n_hash: 2, max_len: 16, pred_weight: 0.5, n_neg: 1024}
    router_prior_weight: 1.0
    router_prior_frac: 0.1
  ngram_embed:
    ns: [3, 4, 5, 6, 7, 8]
    buckets: 4817
  prefix_head: {buckets: 64000, rank: 64, k: 16, max_len: 16, use_main: true, prior_scale: 4.0}
  norm_eps: 1.0e-05
  initializer_range: 0.02
  lr_multiplier: auto
  lr_multiplier_n_gpt: 4.145
# Not part of the model (scripts/flops_report.py, tests).
matching: {seq_len_bytes: 8512, seq_len_tokens: 2048, bytes_per_token: 4.145, reference: bpe_L03}
ladder: {rung: L03, variant: hnet_ws, bytes_per_token: 4.145, vocab: 32768}
