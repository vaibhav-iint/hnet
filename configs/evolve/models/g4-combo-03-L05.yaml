# g4-combo-03-L05: g4-combo-03 transferred to rung L05 (scripts: orchestrator fit_L05): the L03 edits vs hnet_ws_L03
# applied to hnet_ws_L05, chunk table halved, n-gram buckets fitted so params <= BPE L05 (38,195,328).
model:
  type: hnet
  arch_layout:
  - m3
  - [T5]
  - m3
  d_model: [224, 384]
  d_intermediate: [0, 1408]
  vocab_size: 256
  tie_embeddings: false
  ssm: {d_state: 96, d_conv: 4, expand: 2, headdim: 64, ngroups: 1, chunk_size: 256}
  attn:
    num_heads: [3, 5]
    num_kv_heads: null
    head_dim: [null, 128]
    rotary_emb_dim: [null, null]
    rope_theta: 10000.0
    window_size: [-1, -1]
    nope_every: 0
  dc:
    target_ratios: [4.145]
    ratio_loss_alpha: 0.03
    router: end_mlp
    router_kwargs: {init_scale: 0.0}
    decision: quantile
    chunker: select
    dechunker: ema
    ste: true
    aux_loss: ratio
    aux_loss_scope: local
    chunk_vocab:
    - buckets: 16310
      n_hash: 2
      max_len: 16
      pred_weight: 0.5
      n_neg: 1024
      suffix_lens: [2, 3, 4, 6, 8, 12, 16]
      suffix_gate_init: 0.0
    router_prior_weight: 0.0
    router_prior_frac: 0.1
    dechunk_slots: 4
    decision_kwargs: {probe_rank: 32, feat_point: 1.0, router_w0: 0.1, router_ramp: 0.3,
      score_floor: 0.1, teach: 1.0}
  ngram_embed:
    ns: [3, 4, 5, 6, 7, 8]
    buckets: 7361
  norm_eps: 1.0e-05
  initializer_range: 0.02
  lr_multiplier: auto
  lr_multiplier_n_gpt: 4.145
  match_model:
    orders: [4, 8, 16, 32]
    enc: true
    dec: true
    gate: true
  trie_head: {rows: 77383, dim: 32, n_hash: 2, max_len: 16, query: main, topk: 64}
matching: {seq_len_bytes: 8512, seq_len_tokens: 2048, bytes_per_token: 4.145, reference: bpe_L05}
ladder: {rung: L05, variant: hnet_ws, bytes_per_token: 4.145, vocab: 32768}
