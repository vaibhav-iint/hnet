# g5-compute-02: g4-combo-02 + a surprise-routed first-byte chunk refresh (hnet/model/refresh.py), paid by MLP width.
# Main stays T3 (depth at the chunk end unchanged); stage-1 d_intermediate 896 -> 512 (main and refresh); refresh
# {layout: T1, capacity: 0.5}: only the half of the chunks whose revealed first byte surprised a detached low-rank
# next-byte probe on the main output (exact top-k in training, running threshold in eval) get the extra position.
# n-gram buckets 4355 -> 4382 spend the freed parameters (params <= BPE).
model:
  type: hnet
  arch_layout:
  - m2
  - [T3]
  - m2
  d_model: [192, 256]
  d_intermediate: [0, 512]
  vocab_size: 256
  tie_embeddings: false
  ssm: {d_state: 160, d_conv: 4, expand: 2, headdim: 64, ngroups: 1, chunk_size: 256}
  attn:
    num_heads: [3, 3]
    num_kv_heads: null
    head_dim: [null, 128]
    rotary_emb_dim: [null, null]
    rope_theta: 10000.0
    window_size: [-1, -1]
    nope_every: 0
  dc:
    target_ratios: [4.145]
    ratio_loss_alpha: 0.03
    router: end_mlp
    router_kwargs: {}
    decision: quantile
    chunker: select
    dechunker: ema
    ste: true
    aux_loss: ratio
    aux_loss_scope: local
    chunk_vocab:
    - buckets: 12821
      n_hash: 2
      max_len: 16
      pred_weight: 0.5
      n_neg: 1024
      suffix_lens: [2, 3, 4, 6, 8, 12, 16]
      suffix_gate_init: 0.0
    router_prior_weight: 1.0
    router_prior_frac: 0.1
    dechunk_slots: 4
  ngram_embed:
    ns: [3, 4, 5, 6, 7, 8]
    buckets: 4382
  match_model:
    orders: [4, 8, 16, 32]
    enc: true
    dec: true
    gate: true
  trie_head: {rows: 77383, dim: 32, n_hash: 2, max_len: 16, query: main, topk: 64}
  refresh: {layout: T1, capacity: 0.5, probe_rank: 32, probe_weight: 1.0, gain_init: 0.0}
  norm_eps: 1.0e-05
  initializer_range: 0.02
  lr_multiplier: auto
  lr_multiplier_n_gpt: 4.145
