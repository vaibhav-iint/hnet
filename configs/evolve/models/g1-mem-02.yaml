# g1-mem-02 (evolve generation 1, memory track): hnet_L03 (prior-free) + suffix-keyed chunk memory.
# Copy of configs/ladder/models/hnet_L03.yaml with one edit: dc.chunk_vocab gets suffix_lens [2, 3, 4, 6, 8, 12, 16]:
# the chunk vector also receives the gated rows, from the same 2 x 25733 tables and hashes, of every string of those
# lengths ending at the chunk's last byte (gate sigmoid(W x_j + b + E[len_j]); W, E zero-init, b = 0).
# Params 20,011,495 (+1,470 gate parameters; BPE 20,023,040); FLOPs/byte +0.03% vs hnet.
model:
  type: hnet
  arch_layout: [m2, [T3], m2]
  d_model: [192, 256]
  d_intermediate: [0, 896]
  vocab_size: 256
  tie_embeddings: false
  ssm: {d_state: 160, d_conv: 4, expand: 2, headdim: 64, ngroups: 1, chunk_size: 256}
  attn:
    num_heads: [3, 3]
    num_kv_heads: null
    head_dim: [null, 128]
    rotary_emb_dim: [null, null]
    rope_theta: 10000.0
    window_size: [-1, -1]
    nope_every: 0
  dc:
    target_ratios: [4.145]
    ratio_loss_alpha: 0.03
    router: end_mlp
    router_kwargs: {}
    decision: quantile
    chunker: select
    dechunker: ema
    ste: true
    aux_loss: ratio
    aux_loss_scope: local
    chunk_vocab:
    - {buckets: 25733, n_hash: 2, max_len: 16, pred_weight: 0.5, n_neg: 1024, suffix_lens: [2, 3, 4, 6, 8, 12, 16],
       suffix_gate_init: 0.0}
    router_prior_weight: 0.0
    router_prior_frac: 0.1
  ngram_embed:
    ns: [3, 4, 5, 6, 7, 8]
    buckets: 4817
  norm_eps: 1.0e-05
  initializer_range: 0.02
  lr_multiplier: auto
  lr_multiplier_n_gpt: 4.145
# Not part of the model (scripts/flops_report.py, tests).
matching: {seq_len_bytes: 8512, seq_len_tokens: 2048, bytes_per_token: 4.145, reference: bpe_L03}
ladder: {rung: L03, variant: hnet, bytes_per_token: 4.145, vocab: 32768}
