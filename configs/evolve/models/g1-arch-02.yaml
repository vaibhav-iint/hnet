# g1-arch-02 (evolve generation 1, architecture track): hnet_ws_L03 + offset-resolved read-back (dc.dechunk_slots: 4).
# Copy of configs/ladder/models/hnet_ws_L03.yaml (do not regenerate). Changes: the `dechunk_slots` line, and n-gram
# buckets 4817 -> 4700 (-134,784 params) to pay for the 4 x 192 x 192 = 147,456 slot parameters (total <= bpe_L03).
# FLOPs/byte +1.05% vs hnet_L03 (2 K d^2 per chunk, counted in hnet.flops).
model:
  type: hnet
  arch_layout: [m2, [T3], m2]
  d_model: [192, 256]
  d_intermediate: [0, 896]
  vocab_size: 256
  tie_embeddings: false
  ssm: {d_state: 160, d_conv: 4, expand: 2, headdim: 64, ngroups: 1, chunk_size: 256}
  attn:
    num_heads: [3, 3]
    num_kv_heads: null
    head_dim: [null, 128]
    rotary_emb_dim: [null, null]
    rope_theta: 10000.0
    window_size: [-1, -1]
    nope_every: 0
  dc:
    target_ratios: [4.145]
    ratio_loss_alpha: 0.03
    router: end_mlp
    router_kwargs: {}
    decision: quantile
    chunker: select
    dechunker: ema
    dechunk_slots: 4
    ste: true
    aux_loss: ratio
    aux_loss_scope: local
    chunk_vocab:
    - {buckets: 25733, n_hash: 2, max_len: 16, pred_weight: 0.5, n_neg: 1024}
    router_prior_weight: 1.0
    router_prior_frac: 0.1
  ngram_embed:
    ns: [3, 4, 5, 6, 7, 8]
    buckets: 4700
  norm_eps: 1.0e-05
  initializer_range: 0.02
  lr_multiplier: auto
  lr_multiplier_n_gpt: 4.145
matching: {seq_len_bytes: 8512, seq_len_tokens: 2048, bytes_per_token: 4.145, reference: bpe_L03}
ladder: {rung: L03, variant: g1-arch-02, bytes_per_token: 4.145, vocab: 32768}
