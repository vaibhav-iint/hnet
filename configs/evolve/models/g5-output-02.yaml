# g5-output-02: g4-combo-02 (match + suffix memory + fast trie top-64 + offset read-back; Muon-native LR is a trainer
# override) with the parameter budget moved from the input side to the output side by measurement: the chunk table
# is halved again (12821 -> 6410 buckets per hash: the least load-bearing table per parameter in both ablation probes,
# logbook/evolve/candidates/g5-output-02/budget_probe.json) and its 2.46M parameters go to the prefix-trie output
# head's rows (77383 -> 115849 per table): zero extra FLOPs (lookups), same parameter count as g4-combo-02.
model:
  type: hnet
  arch_layout:
  - m2
  - [T3]
  - m2
  d_model: [192, 256]
  d_intermediate: [0, 896]
  vocab_size: 256
  tie_embeddings: false
  ssm: {d_state: 160, d_conv: 4, expand: 2, headdim: 64, ngroups: 1, chunk_size: 256}
  attn:
    num_heads: [3, 3]
    num_kv_heads: null
    head_dim: [null, 128]
    rotary_emb_dim: [null, null]
    rope_theta: 10000.0
    window_size: [-1, -1]
    nope_every: 0
  dc:
    target_ratios: [4.145]
    ratio_loss_alpha: 0.03
    router: end_mlp
    router_kwargs: {}
    decision: quantile
    chunker: select
    dechunker: ema
    ste: true
    aux_loss: ratio
    aux_loss_scope: local
    chunk_vocab:
    - buckets: 6410
      n_hash: 2
      max_len: 16
      pred_weight: 0.5
      n_neg: 1024
      suffix_lens: [2, 3, 4, 6, 8, 12, 16]
      suffix_gate_init: 0.0
    router_prior_weight: 1.0
    router_prior_frac: 0.1
    dechunk_slots: 4
  ngram_embed:
    ns: [3, 4, 5, 6, 7, 8]
    buckets: 4355
  match_model:
    orders: [4, 8, 16, 32]
    enc: true
    dec: true
    gate: true
  trie_head: {rows: 115849, dim: 32, n_hash: 2, max_len: 16, query: main, topk: 64}
  norm_eps: 1.0e-05
  initializer_range: 0.02
  lr_multiplier: auto
  lr_multiplier_n_gpt: 4.145
