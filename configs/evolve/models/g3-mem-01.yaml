# g3-mem-01 (evolve generation 3, memory track): g1-mem-01 with the fast trie head (hnet/model/trie_head.py, topk).
# Copy of configs/evolve/models/g1-mem-01.yaml (hnet_ws_L03 + prefix-trie output vocabulary, chunk vocabulary halved
# to pay for it) with one edit: trie_head.topk 64 -- the trie scores only the 64 bytes the LM head ranks highest at
# each position (same keys hash(chunk prefix . b), same tables, same main-network query), instead of all 256.
# Same parameters as g1-mem-01 (20,022,761 <= BPE 20,023,040); FLOPs/byte +0.27% vs hnet_ws (g1-mem-01: +0.55%).
model:
  type: hnet
  arch_layout: [m2, [T3], m2]
  d_model: [192, 256]
  d_intermediate: [0, 896]
  vocab_size: 256
  tie_embeddings: false
  ssm: {d_state: 160, d_conv: 4, expand: 2, headdim: 64, ngroups: 1, chunk_size: 256}
  attn:
    num_heads: [3, 3]
    num_kv_heads: null
    head_dim: [null, 128]
    rotary_emb_dim: [null, null]
    rope_theta: 10000.0
    window_size: [-1, -1]
    nope_every: 0
  dc:
    target_ratios: [4.145]
    ratio_loss_alpha: 0.03
    router: end_mlp
    router_kwargs: {}
    decision: quantile
    chunker: select
    dechunker: ema
    ste: true
    aux_loss: ratio
    aux_loss_scope: local
    chunk_vocab:
    - {buckets: 12853, n_hash: 2, max_len: 16, pred_weight: 0.5, n_neg: 1024}
    router_prior_weight: 1.0
    router_prior_frac: 0.1
  ngram_embed:
    ns: [3, 4, 5, 6, 7, 8]
    buckets: 4817
  trie_head: {rows: 77383, dim: 32, n_hash: 2, max_len: 16, query: main, topk: 64}
  norm_eps: 1.0e-05
  initializer_range: 0.02
  lr_multiplier: auto
  lr_multiplier_n_gpt: 4.145
# Not part of the model (scripts/flops_report.py, tests).
matching: {seq_len_bytes: 8512, seq_len_tokens: 2048, bytes_per_token: 4.145, reference: bpe_L03}
ladder: {rung: L03, variant: hnet_ws, bytes_per_token: 4.145, vocab: 32768}
