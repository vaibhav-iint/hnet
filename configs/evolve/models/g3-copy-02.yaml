    - 4
    - 8
    - 16
    - 32
    enc: true
    dec: true
    gate: true
  copy_route:
    kappa: 2.5
    kappa_break: 1.0
    run: 4
    min_order: 8
    learn: true
  norm_eps: 1.0e-05
  initializer_range: 0.02
  lr_multiplier: auto
  lr_multiplier_n_gpt: 4.145
