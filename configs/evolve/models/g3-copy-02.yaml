# g3-copy-02: g2-match-mem + copy-aware compression (hnet/model/chunk_copy.py CopyRoute, HNetConfig.copy_route): the stage-0 rank decision moves boundaries out of verified copies (13 params).
model:
  type: hnet
  arch_layout:
  - m2
  - - T3
  - m2
  d_model:
  - 192
  - 256
  d_intermediate:
  - 0
  - 896
  vocab_size: 256
  tie_embeddings: false
  ssm:
    d_state: 160
    d_conv: 4
    expand: 2
    headdim: 64
    ngroups: 1
    chunk_size: 256
  attn:
    num_heads:
    - 3
    - 3
    num_kv_heads: null
    head_dim:
    - null
    - 128
    rotary_emb_dim:
    - null
    - null
    rope_theta: 10000.0
    window_size:
    - -1
    - -1
    nope_every: 0
  dc:
    target_ratios:
    - 4.145
    ratio_loss_alpha: 0.03
    router: end_mlp
    router_kwargs: {}
    decision: quantile
    chunker: select
    dechunker: ema
    ste: true
    aux_loss: ratio
