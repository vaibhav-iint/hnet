# evolve generation 4 (scripts/evolve/make_gen.py; benchmark: configs/search/ladder_1e16_L03.yaml)
name: evolve_g4
out_root: runs/search/evolve_g4
gcs: gs://neat-dispatch-501718-a5-hnet/runs/evolve_g4
seeds:
- 1
- 2
params:
  best_mlr:
    bpe: 0.02
  adam_lr: 0.003
params_note: best_mlr.bpe = BPE's best Muon LR from ladder_lr_1e16 (report/best_params.yaml); adam_lr = Adam-part LR (embeddings,
  heads, norms), fixed, not tuned yet
fairness: strict
set:
- train.optimizer=muon
- train.muon.lr=${best_mlr.bpe}
- train.muon.lr_embed=${adam_lr}
- train.muon.lr_head=${adam_lr}
- train.muon.lr_other=${adam_lr}
- train.muon.momentum_warmup_steps=90
- eval.every=90
- train.ckpt_every=227
runs:
- name: g4_combo_02
  config: configs/ladder/runs/ladder_hnet.yaml
  model: configs/evolve/models/g4-combo-02.yaml
  set:
  - data.micro_batch=8
  - data.batch_bytes=544768
  - train.train_bytes=494649344
  - model.lr_multiplier_kinds=[embed,head,other]
  seeds:
  - 1
  - 2
  - 3
- name: g4_combo_03
  config: configs/ladder/runs/ladder_hnet.yaml
  model: configs/evolve/models/g4-combo-03.yaml
  set:
  - data.micro_batch=8
  - data.batch_bytes=544768
  - train.train_bytes=494649344
  - model.lr_multiplier_kinds=[embed,head,other]
- name: g3_combo_01
  config: configs/ladder/runs/ladder_hnet.yaml
  model: configs/evolve/models/g3-combo-01.yaml
  set:
  - data.micro_batch=8
  - data.batch_bytes=544768
  - train.train_bytes=494649344
  - model.lr_multiplier_kinds=[embed,head,other]
  seeds:
  - 3
- name: g3_mem_02
  config: configs/ladder/runs/ladder_hnet.yaml
  model: configs/evolve/models/g3-mem-02.yaml
  set:
  - data.micro_batch=8
  - data.batch_bytes=544768
  - train.train_bytes=494649344
  seeds:
  - 3
- name: g2_bpe_match
  config: configs/ladder/runs/ladder_bpe.yaml
  model: configs/evolve/models/g2-bpe-match.yaml
  set:
  - data.micro_batch=16
  - data.batch_tokens=131072
  - train.train_tokens=119013376
  seeds:
  - 3
report:
  baseline: null
  labels:
    g4_combo_02: The two g3 arms that tie BPE + copy (1
    g4_combo_03: 'The fully tokenizer-free version of g4-combo-02: no whitespace warm start'
    g3_combo_01: Orchestrator crossover of every component confirmed on two seeds or on seed 1 on top of the match model
    g3_mem_02: The best H-Net (g2-match-mem, 1
    g2_bpe_match: If the byte match model's gain is a copying gain, BPE gains comparably
