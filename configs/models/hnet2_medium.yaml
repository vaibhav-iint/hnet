# hnet2_medium: 2-stage (3,3)-DC H-Net matched to bpe_medium (C2)
# Generated by WS-B (hnet/flops.py); matching table: configs/MATCHING.md, regenerate numbers with
# scripts/flops_report.py. FLOPs: SPEC convention (causal attention, LM head, no embedding, backward = 2x).
model:
  type: "hnet"
  arch_layout: ["m4", ["T1m4", ["T27"], "m4T1"], "m4"]
  d_model: [704, 704, 1024]
  d_intermediate: [0, 1920, 2816]
  vocab_size: 256
  tie_embeddings: false
  ssm: {"d_state": 128, "d_conv": 4, "expand": 2, "headdim": 64, "ngroups": 1, "chunk_size": 256}
  attn: {"num_heads": [11, 11, 16], "num_kv_heads": null, "rotary_emb_dim": [32, 32, 32], "rope_theta": 10000.0, "window_size": [1023, 1023, -1], "nope_every": 0}
  dc: {"target_ratios": [3.0, 3.0], "ratio_loss_alpha": 0.03, "router": "cosine_lookahead", "router_kwargs": {}, "chunker": "select", "dechunker": "ema", "ste": true, "aux_loss": "ratio", "aux_loss_scope": "local"}
  norm_eps: 1.0e-05
  initializer_range: 0.02
  lr_multiplier: "auto"
  lr_multiplier_n_gpt: 4.6
# Not part of the model; read by scripts/flops_report.py only.
matching:
  seq_len_bytes: 8192
  seq_len_tokens: 1792
  bytes_per_token: 4.6
  reference: "bpe_medium"
