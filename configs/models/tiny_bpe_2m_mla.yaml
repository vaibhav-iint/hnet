# tiny_bpe_2m_mla: tiny_bpe_2m with the attention mixer swapped for MLA (DeepSeek-V2/V3), kv_lora_rank 96 / q_lora_rank 64 / qk 16+16 rope / v 32 (qk dims as the base).
# FLOPs/byte matched to tiny_bpe_2m (+-1%) by the variant's own knobs; see configs/MATCHING.md
# ("Attention variants") and docs/ATTENTION_DEEPSEEK.md. WS-I1.
model:
  type: "dense"
  variant: "llama"
  vocab_size: 50304
  d_model: 128
  n_layers: 10
  d_intermediate: 384
  num_heads: 4
  num_kv_heads: null
  rope_theta: 10000.0
  nope_every: 0
  tie_embeddings: false
  norm_eps: 1.0e-05
  initializer_range: 0.02
  mixer: "mla"
  mixer_kwargs: {"kv_lora_rank": 96, "q_lora_rank": 64, "qk_nope_head_dim": 16, "qk_rope_head_dim": 16, "v_head_dim": 32}
# Not part of the model; read by scripts/flops_report.py only.
matching:
  seq_len_bytes: 2048
  seq_len_tokens: 448
  bytes_per_token: 4.6
  reference: "tiny_bpe_2m"
  variant_of: "tiny_bpe_2m"  # differs only in the attention mixer (tests/test_mixers_deepseek.py)
