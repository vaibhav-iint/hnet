# tiny_bpe_10m: tiny BPE model, ~10M non-embedding params
# Generated by WS-B (hnet/flops.py); matching table: configs/MATCHING.md, regenerate numbers with
# scripts/flops_report.py. FLOPs: SPEC convention (causal attention, LM head, no embedding, backward = 2x).
model:
  type: "dense"
  variant: "llama"
  vocab_size: 50304
  d_model: 256
  n_layers: 12
  d_intermediate: 768
  num_heads: 8
  num_kv_heads: null
  rope_theta: 10000.0
  nope_every: 0
  tie_embeddings: false
  norm_eps: 1.0e-05
  initializer_range: 0.02
# Not part of the model; read by scripts/flops_report.py only.
matching:
  seq_len_bytes: 2048
  seq_len_tokens: 448
  bytes_per_token: 4.6
  reference: null
