# bpe_small: BPE Transformer, GPT-3 Small shape (A1)
# Generated by WS-B (hnet/flops.py); matching table: configs/MATCHING.md, regenerate numbers with
# scripts/flops_report.py. FLOPs: SPEC convention (causal attention, LM head, no embedding, backward = 2x).
model:
  type: "dense"
  variant: "llama"
  vocab_size: 50304
  d_model: 768
  n_layers: 12
  d_intermediate: 2048
  num_heads: 12
  num_kv_heads: null
  rope_theta: 10000.0
  nope_every: 0
  tie_embeddings: false
  norm_eps: 1.0e-05
  initializer_range: 0.02
# Not part of the model; read by scripts/flops_report.py only.
matching:
  seq_len_bytes: 8192
  seq_len_tokens: 1792
  bytes_per_token: 4.6
  reference: null
