# tiny_hnet2_10m_end_mlp: tiny_hnet2_10m with dc.router end_mlp (MLP end-of-chunk router); not re-matched (within +-2%)
# Generated by WS-B (hnet/flops.py); matching table: configs/MATCHING.md, regenerate numbers with
# scripts/flops_report.py. FLOPs: SPEC convention (causal attention, LM head, no embedding, backward = 2x).
model:
  type: "hnet"
  arch_layout: ["m4", ["T1m4", ["T10"], "m4T1"], "m4"]
  d_model: [160, 224, 384]
  d_intermediate: [0, 640, 1024]
  vocab_size: 256
  tie_embeddings: false
  ssm: {"d_state": 32, "d_conv": 4, "expand": 2, "headdim": 32, "ngroups": 1, "chunk_size": 256}
  attn: {"num_heads": [5, 7, 12], "num_kv_heads": null, "rotary_emb_dim": [16, 16, 16], "rope_theta": 10000.0, "window_size": [1023, 1023, -1], "nope_every": 0}
  dc: {"target_ratios": [3.0, 3.0], "ratio_loss_alpha": 0.03, "router": "end_mlp", "router_kwargs": {}, "chunker": "select", "dechunker": "ema", "ste": true, "aux_loss": "ratio", "aux_loss_scope": "local"}
  norm_eps: 1.0e-05
  initializer_range: 0.02
  lr_multiplier: "auto"
  lr_multiplier_n_gpt: 4.6
# Not part of the model; read by scripts/flops_report.py only.
matching:
  seq_len_bytes: 2048
  seq_len_tokens: 448
  bytes_per_token: 4.6
  reference: "tiny_bpe_10m"
  ablation_of: "tiny_hnet2_10m"
