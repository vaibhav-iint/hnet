# Quick GPU sanity run (minutes): tiny BPE, 2048-byte-equivalent windows (448 tokens), 64 windows/step, 50M tokens.
include: _core_bpe.yaml
model: {include: ../models/tiny_bpe_2m.yaml}
data: {seq_len: 448, micro_batch: 64, batch_tokens: 28672, n_train_shards: 1}
train: {out_dir: runs/tiny/tiny_bpe_2m, train_tokens: 5.0e7, lr: 1.5e-3, ckpt_every: 500}
eval: {every: 250, val_bytes: 1000000, val_byte_seq_len: 2048, val_token_seq_len: 448, downstream: null}
log: {every: 10, wandb: null}
